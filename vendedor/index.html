<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBORA - Panel Vendedor</title>
    <style>
        :root {
            --bg: #100516;
            --panel: #180b20;
            --pink: #f51b91;
            --text: #eee7f0;
            --muted: #b8acba;
            --green: #16c784;
            --line: #6f2c7b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: radial-gradient(circle at 50% -10%, #2a0d34 0, #100516 42%, #0b0310 100%);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: var(--pink);
            margin-bottom: 20px;
        }

        .btn {
            border: 1px solid var(--line);
            background: #1b0b24;
            color: var(--text);
            border-radius: 10px;
            padding: 11px 16px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }

        .btn:hover {
            border-color: var(--pink);
            transform: translateY(-1px);
        }

        .btn.danger {
            background: #ff4444;
            color: white;
            border-color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>👨‍💼 Panel de Vendedor</h1>
        <p>Bienvenido al panel de vendedores de DEBORA</p>
        <p style="color: var(--muted); font-size: 14px;">
            Panel completo en desarrollo...
        </p>
        
        <div style="margin-top: 30px;">
            <a href="../index.html" class="btn">← Volver al Inicio</a>
            <button class="btn danger" onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyB7kXhJ5zy5FMhmksPzdSleO1A7aWMbtu0",
            authDomain: "deboracatalogo.firebaseapp.com",
            projectId: "deboracatalogo",
            storageBucket: "deboracatalogo.firebasestorage.app",
            messagingSenderId: "552563622109",
            appId: "1:552563622109:web:ce43fbb7ca5f581c8cdb34"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Verificar autenticación
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== 'vendedor@debora.com') {
                window.location.href = '../index.html';
            }
        });

        window.logout = async function() {
            try {
                await signOut(auth);
                window.location.href = '../index.html';
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
                alert('Error al cerrar sesión');
            }
        };
    </script>
</body>
</html>
