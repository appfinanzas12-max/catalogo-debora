<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100516">
<meta name="description" content="DEBORA - Catálogo">
<title>DEBORA</title>
<style>
:root{--bg:#100516;--panel:#180b20;--panel2:#21102b;--pink:#f51b91;--pink2:#ff55ad;--text:#eee7f0;--muted:#b8acba;--green:#16c784;--line:#6f2c7b;--shadow:0 18px 55px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#2a0d34 0,#100516 42%,#0b0310 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;position:relative}
.topbar{position:sticky;top:0;z-index:20;height:72px;border-bottom:1px solid rgba(245,27,145,.5);background:rgba(16,5,22,.9);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,64px)}
.brand{border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;min-width:120px;color:#fff;font-size:28px;font-weight:900;letter-spacing:.2em;text-shadow:0 0 18px rgba(245,27,145,.45)}
.topbar-actions{display:flex;gap:10px;align-items:center}
.btn-login{border:1px solid var(--line);background:#1b0b24;color:var(--text);border-radius:10px;padding:11px 16px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.btn-login:hover{border-color:var(--pink);background:rgba(245,27,145,.1)}
.hero{max-width:1120px;margin:0 auto;padding:42px 22px 35px;text-align:center;position:relative;z-index:1}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.02;margin:12px 0;color:#fff}
.hero p{max-width:650px;margin:0 auto;color:var(--muted);font-size:15px;line-height:1.7}
.section{max-width:1160px;margin:0 auto;padding:34px 22px 75px;position:relative;z-index:1}
.section h2{font-size:30px;margin:0 0 10px;color:#fff}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.product{background:linear-gradient(145deg,#1a0b22,#120616);border:1px solid #4e2359;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:40% 60%;min-height:360px;transition:.25s}
.product:hover{border-color:var(--pink);box-shadow:var(--shadow);transform:translateY(-2px)}
.product-media{background:#0e0612;min-height:360px;display:flex;align-items:center;justify-content:center;padding:14px}
.product-media img{width:100%;height:100%;max-height:340px;object-fit:contain;border-radius:11px}
.product-body{padding:20px 19px;display:flex;flex-direction:column}
.tag{display:inline-flex;align-self:flex-start;background:var(--pink);color:#fff;border-radius:7px;padding:6px 9px;font-size:9px;font-weight:900;letter-spacing:.06em}
.product h2{font-size:16px;line-height:1.3;margin:13px 0 9px}
.desc{font-size:11px;color:var(--muted);line-height:1.55;margin:0 0 12px}
.meta{display:grid;gap:6px;font-size:10px;color:#d9d0dc}
.meta b{color:var(--pink)}
.product-bottom{margin-top:auto;display:flex;gap:9px;align-items:end}
.price{border:1px solid var(--pink);border-radius:8px;padding:9px 11px;min-width:105px}
.price small{display:block;color:var(--pink);font-size:7px;font-weight:900;letter-spacing:.14em}
.price strong{font-size:15px}
.wa{flex:1;border:0;background:var(--green);color:#07150f;border-radius:8px;padding:11px 8px;font-size:9px;font-weight:900;cursor:pointer}
.wa:hover{filter:brightness(1.06)}
footer{border-top:1px solid rgba(245,27,145,.25);padding:24px clamp(22px,5vw,64px);display:flex;justify-content:space-between;color:#8f8491;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(3,0,5,.78);display:none;place-items:center;padding:20px;z-index:50;backdrop-filter:blur(8px)}
.modal.open{display:grid}
.modal-card{position:relative;width:min(500px,100%);border:1px solid var(--line);border-radius:20px;background:#140719;box-shadow:var(--shadow);padding:26px}
.close{position:absolute;right:15px;top:12px;background:transparent;border:0;color:#fff;font-size:28px;cursor:pointer}
.login-form{text-align:center}
.login-form h2{margin:0 0 20px;color:#fff}
.form-group{margin:15px 0;text-align:left}
.form-group label{display:block;margin-bottom:5px;font-size:12px;font-weight:700;color:var(--text)}
.form-group input{width:100%;background:#1a0b22;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:8px;font-size:14px;outline:none}
.form-group input:focus{border-color:var(--pink);box-shadow:0 0 10px rgba(245,27,145,.2)}
.btn-submit{width:100%;background:var(--pink);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:15px}
.btn-submit:hover{background:var(--pink2)}
.error-msg{color:#ff6b6b;font-size:12px;margin:10px 0}
@media(max-width:900px){.products{grid-template-columns:1fr}.product{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <button class="brand">DEBORA</button>
  <div class="topbar-actions">
    <button class="btn-login" onclick="abrirLogin()">👤 Iniciar Sesión</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1>DEBORA</h1>
    <p>Catálogo de Productos Premium</p>
  </section>

  <section class="section">
    <h2>Productos Destacados</h2>
    <div class="products" id="productos-container">
      <p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px">Cargando productos...</p>
    </div>
  </section>
</main>

<footer>
  <span>&copy; 2024 DEBORA. Todos los derechos reservados.</span>
</footer>

<!-- Modal de Login -->
<div id="loginModal" class="modal">
  <div class="modal-card">
    <button class="close" onclick="cerrarLogin()">&times;</button>
    <div class="login-form">
      <h2>Inicia Sesión</h2>
      <div id="error-login" class="error-msg" style="display:none;"></div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">Iniciar Sesión</button>
      </form>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

<script>
// ========== CONFIGURACIÓN FIREBASE ==========
const firebaseConfig = {
  apiKey: "AIzaSyB7kXhJ5zy5FMhmksPzdSleO1A7aWMbtu0",
  authDomain: "deboracatalogo.firebaseapp.com",
  projectId: "deboracatalogo",
  storageBucket: "deboracatalogo.firebasestorage.app",
  messagingSenderId: "552563622109",
  appId: "1:552563622109:web:ce43fbb7ca5f581c8cdb34"
};

let app_firebase, auth, db;

// Inicializar Firebase
try {
  app_firebase = firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  console.log('Firebase inicializado correctamente');
} catch (error) {
  console.error('Error inicializando Firebase:', error);
}

// ========== VARIABLES GLOBALES ==========
let currentUser = null;

// ========== FUNCIONES MODAL ==========
function abrirLogin() {
  document.getElementById('loginModal').classList.add('open');
}

function cerrarLogin() {
  document.getElementById('loginModal').classList.remove('open');
}

// ========== FUNCIONES AUTH ==========
async function handleLogin(event) {
  event.preventDefault();
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('error-login');

  try {
    const userCredential = await auth.signInWithEmailAndPassword(email, password);
    const firebaseUser = userCredential.user;

    // Obtener datos de Firestore
    const userDoc = await db.collection('users').doc(firebaseUser.email).get();
    
    if (userDoc.exists) {
      const userData = userDoc.data();
      currentUser = {
        email: firebaseUser.email,
        name: userData.name,
        role: userData.role
      };

      cerrarLogin();
      mostrarDashboard();
    } else {
      throw new Error('Usuario no configurado en el sistema');
    }
  } catch (error) {
    errorDiv.textContent = 'Error: ' + error.message;
    errorDiv.style.display = 'block';
  }
}

// ========== DASHBOARD ==========
function mostrarDashboard() {
  if (!currentUser) return;

  const html = `
    <div style="min-height:100vh;background:linear-gradient(circle at 50% -10%,#2a0d34 0,#100516 42%,#0b0310 100%);">
      <header class="topbar">
        <button class="brand">DEBORA - ${currentUser.role}</button>
        <div class="topbar-actions">
          <span style="color:var(--text);">${currentUser.name}</span>
          <button class="btn-login" onclick="logout()">Salir</button>
        </div>
      </header>
      
      <main style="max-width:1200px;margin:0 auto;padding:40px 20px;">
        <h1 style="color:#fff;margin-bottom:30px;">Bienvenido, ${currentUser.name}</h1>
        
        ${currentUser.role === 'ADMIN' ? getDashboardAdmin() : getDashboardVendor()}
      </main>
    </div>
  `;

  document.body.innerHTML = html;
}

function getDashboardAdmin() {
  return `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:40px;">
      <div style="background:rgba(245,27,145,.1);border:1px solid #6f2c7b;padding:20px;border-radius:12px;text-align:center;">
        <h3 style="color:#b8acba;margin:0;">Productos</h3>
        <p style="font-size:28px;font-weight:900;color:#f51b91;margin:10px 0 0;">0</p>
      </div>
      <div style="background:rgba(245,27,145,.1);border:1px solid #6f2c7b;padding:20px;border-radius:12px;text-align:center;">
        <h3 style="color:#b8acba;margin:0;">Vendedores</h3>
        <p style="font-size:28px;font-weight:900;color:#f51b91;margin:10px 0 0;">0</p>
      </div>
      <div style="background:rgba(245,27,145,.1);border:1px solid #6f2c7b;padding:20px;border-radius:12px;text-align:center;">
        <h3 style="color:#b8acba;margin:0;">Ventas</h3>
        <p style="font-size:28px;font-weight:900;color:#f51b91;margin:10px 0 0;">$0</p>
      </div>
    </div>

    <div style="background:linear-gradient(145deg,#21102b,#14071a);border:1px solid #6f2c7b;padding:30px;border-radius:16px;">
      <h2 style="color:#fff;margin-top:0;">Panel de Administración</h2>
      <p style="color:#b8acba;margin-bottom:20px;">Aquí podrás gestionar productos, vendedores, comisiones y más.</p>
      
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;">
        <button onclick="alert('Crear producto')" style="background:#f51b91;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-weight:700;">+ Crear Producto</button>
        <button onclick="alert('Ver vendedores')" style="background:#f51b91;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-weight:700;">👥 Ver Vendedores</button>
        <button onclick="alert('Ver comisiones')" style="background:#f51b91;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-weight:700;">📈 Comisiones (10%)</button>
        <button onclick="alert('Descargar PDF')" style="background:#f51b91;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-weight:700;">📥 Descargar PDF</button>
      </div>
    </div>
  `;
}

function getDashboardVendor() {
  return `
    <div style="background:linear-gradient(145deg,#21102b,#14071a);border:1px solid #6f2c7b;padding:30px;border-radius:16px;">
      <h2 style="color:#fff;margin-top:0;">Mis Comisiones</h2>
      <p style="color:#b8acba;margin-bottom:20px;">Vendas Realizadas: <strong style="color:#f51b91;">$0</strong></p>
      <p style="color:#b8acba;margin-bottom:20px;">Comisión (10%): <strong style="color:#16c784;">$0</strong></p>
      <p style="color:#b8acba;margin-bottom:30px;">Estado: <strong>Pendiente de Pago</strong></p>
      
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;">
        <button onclick="alert('Descargar catálogo')" style="background:#f51b91;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-weight:700;">📥 Descargar Catálogo PDF</button>
        <button onclick="alert('Subir comprobante')" style="background:#16c784;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-weight:700;">📄 Subir Comprobante</button>
      </div>
    </div>
  `;
}

function logout() {
  auth.signOut();
  currentUser = null;
  location.reload();
}

// ========== CARGAR PRODUCTOS ==========
function cargarProductos() {
  // Por ahora, productos de demostración
  const container = document.getElementById('productos-container');
  container.innerHTML = `
    <p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px;">No hay productos disponibles aún</p>
  `;
}

// Inicializar cuando carga la página
document.addEventListener('DOMContentLoaded', function() {
  cargarProductos();
});
</script>
</body>
</html>
