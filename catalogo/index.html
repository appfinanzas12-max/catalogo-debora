<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DEBORA · Catálogo</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #100516;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 1px solid #6f2c7b;
            border-radius: 20px;
            background: #140719;
            box-shadow: 0 22px 65px rgba(0,0,0,0.5);
        }
        h1 { color: #f51b91; margin-bottom: 20px; }
        p { color: #b8acba; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #f51b91;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Catálogo DEBORA</h1>
        <p>¡Bienvenido al catálogo completo de productos DEBORA!</p>
        <p>Descubre nuestra amplia selección de productos de la más alta calidad.</p>
        
        <a href="../" class="btn">Ver Catálogo Completo</a>
    </div>
</body>
</html>
