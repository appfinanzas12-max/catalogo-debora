<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBORA - Catálogo</title>
    <style>
        :root {
            --bg: #100516;
            --panel: #180b20;
            --pink: #f51b91;
            --text: #eee7f0;
            --muted: #b8acba;
            --green: #16c784;
            --line: #6f2c7b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: radial-gradient(circle at 50% -10%, #2a0d34 0, #100516 42%, #0b0310 100%);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: var(--pink);
            margin-bottom: 20px;
        }

        .btn {
            border: 1px solid var(--line);
            background: #1b0b24;
            color: var(--text);
            border-radius: 10px;
            padding: 11px 16px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }

        .btn:hover {
            border-color: var(--pink);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>🛍️ Catálogo DEBORA</h1>
        <p>Explora nuestro catálogo completo de productos</p>
        <p style="color: var(--muted); font-size: 14px;">
            Catálogo completo en desarrollo...
        </p>
        
        <div style="margin-top: 30px;">
            <a href="../index.html" class="btn">← Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
